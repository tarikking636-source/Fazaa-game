name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project
      run: |
        unzip fazaa_android_project.zip -d extracted_project

    - name: Find and Build APK with Gradle
      run: |
        cd extracted_project
        # البحث تلقائياً عن المجلد الذي يحتوي على ملف التشغيل
        PROJECT_DIR=$(find . -name "gradlew" -maxdepth 3 | xargs dirname)
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
